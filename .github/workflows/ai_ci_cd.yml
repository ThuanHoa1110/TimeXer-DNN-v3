name: AI MLOps CI/CD Pipeline & Docker Hub Delivery

# ==============================================================================
# Quy trình CI/CD hoàn chỉnh cho Bài toán AI: TimeXer-DINOv3 Weather Forecasting
# Học phần: Chuyên đề Trí tuệ Nhân tạo và Khoa học Dữ liệu (Lớp 65TTNT - ĐH Thủy Lợi)
# Sinh viên: Nguyễn Thuận Hóa
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # GIAI ĐOẠN 1: CONTINUOUS INTEGRATION (CI) CHO BÀI TOÁN AI
  # ---------------------------------------------------------------------------
  ai-ci-pipeline:
    name: "CI: Code Linting, PyTorch Model Verification & AI Tests"
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Mã Nguồn Repository
        uses: actions/checkout@v4

      - name: 2. Thiết lập Môi trường Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 3. Nâng cấp Pip & Cài đặt Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          # Cài đặt PyTorch CPU tối ưu cho môi trường CI Runner
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 4. Kiểm tra Cú pháp & Code Quality (Linting)
        run: |
          # Dừng build nếu có lỗi cú pháp nghiêm trọng hoặc biến chưa khai báo
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__

      - name: 5. Chạy Kiểm Thử Chuyên Sâu Mô Hình DINO-v3 Backbone & Composite Loss
        run: |
          python run_test_dinov3.py

      - name: 6. Chạy Bộ Kiểm Thử Tự Động Toàn Trình (AI Test Suite)
        run: |
          python -m unittest tests/test_ai_pipeline.py -v

      - name: 7. Xác thực Model Checkpoint & Inference Engine
        run: |
          python -c "
          from inference_engine import TimeXerInferenceEngine
          import pandas as pd
          engine = TimeXerInferenceEngine()
          df = pd.read_csv('data/stations_sample/st01_hoankiem.csv')
          res = engine.predict(df, horizon=24)
          print('[THÀNH CÔNG] Inference Engine khởi động chuẩn xác. Số bước dự báo:', len(res['predictions']))
          "

  # ---------------------------------------------------------------------------
  # GIAI ĐOẠN 2: CONTINUOUS DELIVERY / DEPLOYMENT (CD) -> DOCKER HUB
  # ---------------------------------------------------------------------------
  docker-cd-pipeline:
    name: "CD: Build Docker Image & Public to Docker Hub"
    needs: ai-ci-pipeline
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: 1. Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: 2. Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Trích xuất Metadata & Tag Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-ai
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 5. Build và Push Docker Image lên Docker Hub (Public)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. Thông báo Trạng thái Triển khai
        run: |
          echo "=========================================================="
          echo "🎉 ĐÃ PUBLIC DOCKER IMAGE THÀNH CÔNG LÊN DOCKER HUB!"
          echo "👉 Repository: https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-ai"
          echo "👉 Lệnh kéo Image: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-ai:latest"
          echo "👉 Lệnh chạy Container: docker run -d -p 8080:8080 --name weather-ai ${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-ai:latest"
          echo "=========================================================="
