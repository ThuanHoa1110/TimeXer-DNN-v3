name: AI MLOps CI/CD Pipeline & Docker Hub Delivery

# ==============================================================================
# Quy trình CI/CD hoàn chỉnh cho Bài toán AI: TimeXer-DINOv3 Weather Forecasting
# Học phần: Chuyên đề Trí tuệ Nhân tạo và Khoa học Dữ liệu (Lớp 65TTNT - ĐH Thủy Lợi)
# Sinh viên: Nguyễn Thuận Hóa
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # GIAI ĐOẠN 1: CONTINUOUS INTEGRATION (CI) CHO BÀI TOÁN AI
  # ---------------------------------------------------------------------------
  ai-ci-pipeline:
    name: "CI: Code Linting, PyTorch Model Verification & AI Tests"
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Mã Nguồn Repository
        uses: actions/checkout@v4

      - name: 2. Thiết lập Môi trường Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 3. Nâng cấp Pip & Cài đặt Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          # Cài đặt PyTorch CPU tối ưu cho môi trường CI Runner
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: 4. Kiểm tra Cú pháp & Code Quality (Linting)
        run: |
          # Kiểm tra các lỗi cú pháp nghiêm trọng và biến chưa khai báo
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__,data_provider,utils,models/Crossformer.py

      - name: 5. Chạy Kiểm Thử Chuyên Sâu Mô Hình DINO-v3 Backbone & Composite Loss
        run: |
          python run_test_dinov3.py

      - name: 6. Chạy Bộ Kiểm Thử Tự Động Toàn Trình (AI Test Suite)
        run: |
          python -m unittest tests/test_ai_pipeline.py -v

      - name: 7. Xác thực Model Checkpoint & Inference Engine
        run: |
          python -c "
          from inference_engine import TimeXerInferenceEngine
          import pandas as pd
          engine = TimeXerInferenceEngine()
          df = pd.read_csv('data/stations_sample/st01_hoankiem.csv')
          res = engine.predict(df, horizon=24)
          print('[THÀNH CÔNG] Inference Engine khởi động chuẩn xác. Số bước dự báo:', len(res['predictions']))
          "

  # ---------------------------------------------------------------------------
  # GIAI ĐOẠN 2: CONTINUOUS DELIVERY / DEPLOYMENT (CD) -> DOCKER HUB
  # ---------------------------------------------------------------------------
  docker-cd-pipeline:
    name: "CD: Build Docker Image & Public to Docker Hub"
    needs: ai-ci-pipeline
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: 1. Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: 2. Build Docker Image cho Model AI
        run: |
          echo "🚀 Đang build Docker Image cho Model AI TimeXer-DINOv3..."
          docker build -t thuanhoa1110/timexer-dinov3-ai:latest .
          echo "✅ Build Docker Image thành công!"

      - name: 3. Khởi Chạy Thử Nghiệm Container & Kiểm Tra REST API
        run: |
          echo "🚀 Khởi chạy Container để kiểm tra sức khỏe Model Serving..."
          docker run -d -p 8080:8080 --name test_serving thuanhoa1110/timexer-dinov3-ai:latest
          sleep 6
          echo "📋 Logs Container:"
          docker logs test_serving
          echo "🔍 Kiểm tra Endpoint /api/model-info:"
          curl -f http://localhost:8080/api/model-info
          echo "✅ Container hoạt động và suy luận hoàn hảo!"
          docker stop test_serving

      - name: 4. Đăng nhập và Push lên Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "=========================================================="
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "🔑 Đang đăng nhập Docker Hub..."
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker tag thuanhoa1110/timexer-dinov3-ai:latest "$DOCKERHUB_USERNAME/timexer-dinov3-ai:latest"
            docker tag thuanhoa1110/timexer-dinov3-ai:latest "$DOCKERHUB_USERNAME/timexer-dinov3-ai:${{ github.sha }}"
            docker push "$DOCKERHUB_USERNAME/timexer-dinov3-ai:latest"
            docker push "$DOCKERHUB_USERNAME/timexer-dinov3-ai:${{ github.sha }}"
            echo "🎉 ĐÃ PUBLIC DOCKER IMAGE THÀNH CÔNG LÊN DOCKER HUB!"
            echo "👉 Repository: https://hub.docker.com/r/$DOCKERHUB_USERNAME/timexer-dinov3-ai"
          else
            echo "✅ DOCKER IMAGE ĐÃ ĐƯỢC BIÊN DỊCH VÀ XÁC THỰC THÀNH CÔNG 100%!"
            echo "📌 Để kích hoạt tự động đẩy lên Docker Hub:"
            echo "   1. Vào GitHub Settings -> Secrets and variables -> Actions"
            echo "   2. Thêm DOCKERHUB_USERNAME và DOCKERHUB_TOKEN"
          fi
          echo "=========================================================="
