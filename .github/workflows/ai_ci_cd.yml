name: AI MLOps CI/CD Pipeline & Docker Hub Delivery

# ==============================================================================
# Quy trình CI/CD hoàn chỉnh cho Bài toán AI: TimeXer-DINOv3 Weather Forecasting
# Học phần: Chuyên đề Trí tuệ Nhân tạo và Khoa học Dữ liệu (Lớp 65TTNT - ĐH Thủy Lợi)
# Sinh viên: Nguyễn Thuận Hóa
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # GIAI ĐOẠN 1: CONTINUOUS INTEGRATION (CI) CHO BÀI TOÁN AI
  # ---------------------------------------------------------------------------
  ai-ci-pipeline:
    name: "CI: Code Linting, PyTorch Model Verification & AI Tests"
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Mã Nguồn Repository
        uses: actions/checkout@v4

      - name: 2. Thiết lập Môi trường Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 3. Nâng cấp Pip & Cài đặt Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          # Cài đặt PyTorch CPU tối ưu cho môi trường CI Runner
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 4. Kiểm tra Cú pháp & Code Quality (Linting)
        run: |
          # Kiểm tra các lỗi cú pháp nghiêm trọng và biến chưa khai báo
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__,data_provider,utils,models/Crossformer.py

      - name: 5. Chạy Kiểm Thử Chuyên Sâu Mô Hình DINO-v3 Backbone & Composite Loss
        run: |
          python run_test_dinov3.py

      - name: 6. Chạy Bộ Kiểm Thử Tự Động Toàn Trình (AI Test Suite)
        run: |
          python -m unittest tests/test_ai_pipeline.py -v

      - name: 7. Xác thực Model Checkpoint & Inference Engine
        run: |
          python -c "
          from inference_engine import TimeXerInferenceEngine
          import pandas as pd
          engine = TimeXerInferenceEngine()
          df = pd.read_csv('data/stations_sample/st01_hoankiem.csv')
          res = engine.predict(df, horizon=24)
          print('[THÀNH CÔNG] Inference Engine khởi động chuẩn xác. Số bước dự báo:', len(res['predictions']))
          "

  # ---------------------------------------------------------------------------
  # GIAI ĐOẠN 2: CONTINUOUS DELIVERY / DEPLOYMENT (CD) -> DOCKER HUB
  # ---------------------------------------------------------------------------
  docker-cd-pipeline:
    name: "CD: Build Docker Image & Public to Docker Hub"
    needs: ai-ci-pipeline
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: 1. Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: 2. Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Kiểm tra Cấu hình Bí mật Docker Hub (Secrets Check)
        id: check_secrets
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "[INFO] Đã tìm thấy Docker Hub Secrets. Tiến hành build & push tự động!"
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "[WARN] Chưa cấu hình DOCKERHUB_USERNAME hoặc DOCKERHUB_TOKEN trong GitHub Secrets."
          fi

      # TRƯỜNG HỢP A: Đã cấu hình Secrets -> Đăng nhập & Push trực tiếp lên Docker Hub
      - name: 4A. Đăng nhập Docker Hub
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 5A. Trích xuất Metadata & Tag Image
        if: steps.check_secrets.outputs.has_secrets == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-ai
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 6A. Build và Push Docker Image lên Docker Hub (Public)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TRƯỜNG HỢP B: Chưa cấu hình Secrets -> Build kiểm thử Docker Image để xác nhận Dockerfile hợp lệ 100%
      - name: 4B. Build Kiểm Thử Docker Image Cục Bộ
        if: steps.check_secrets.outputs.has_secrets == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: timexer-dinov3-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 7. Báo cáo Kết Quả Triển Khai
        run: |
          echo "=========================================================="
          if [ "${{ steps.check_secrets.outputs.has_secrets }}" == "true" ]; then
            echo "🎉 ĐÃ PUBLIC DOCKER IMAGE THÀNH CÔNG LÊN DOCKER HUB!"
            echo "👉 Repository: https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-ai"
            echo "👉 Lệnh kéo Image: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-ai:latest"
            echo "👉 Lệnh chạy Container: docker run -d -p 8080:8080 --name weather-ai ${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-ai:latest"
          else
            echo "✅ DOCKERFILE ĐÃ ĐƯỢC BIÊN DỊCH VÀ XÁC THỰC THÀNH CÔNG 100%!"
            echo "📌 Để kích hoạt tự động đẩy lên Docker Hub:"
            echo "   1. Vào GitHub Settings -> Secrets and variables -> Actions"
            echo "   2. Thêm DOCKERHUB_USERNAME và DOCKERHUB_TOKEN"
          fi
          echo "=========================================================="
