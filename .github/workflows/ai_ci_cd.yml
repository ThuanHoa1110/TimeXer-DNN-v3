name: AI MLOps CI/CD Pipeline & Docker Hub Delivery

# ==============================================================================
# Quy trình CI/CD hoàn chỉnh cho Bài toán AI: TimeXer-DINOv3 Weather Forecasting
# Học phần: Chuyên đề Trí tuệ Nhân tạo và Khoa học Dữ liệu (Lớp 65TTNT - ĐH Thủy Lợi)
# Sinh viên: Nguyễn Thuận Hóa
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # GIAI ĐOẠN 1: CONTINUOUS INTEGRATION (CI) CHO BÀI TOÁN AI
  # ---------------------------------------------------------------------------
  ai-ci-pipeline:
    name: "CI: Code Linting, PyTorch Model Verification & AI Tests"
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Mã Nguồn Repository
        uses: actions/checkout@v4

      - name: 2. Thiết lập Môi trường Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 3. Nâng cấp Pip & Cài đặt Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          # Cài đặt PyTorch CPU tối ưu cho môi trường CI Runner
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: 4. Kiểm tra Cú pháp & Code Quality (Linting)
        run: |
          # Kiểm tra các lỗi cú pháp nghiêm trọng và biến chưa khai báo
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__,data_provider,utils,models/Crossformer.py

      - name: 5. Chạy Kiểm Thử Chuyên Sâu Mô Hình DINO-v3 Backbone & Composite Loss
        run: |
          python run_test_dinov3.py

      - name: 6. Chạy Bộ Kiểm Thử Tự Động Toàn Trình (AI Test Suite)
        run: |
          python -m unittest tests/test_ai_pipeline.py -v

      - name: 7. Xác thực Model Checkpoint & Inference Engine
        run: |
          python -c "
          from inference_engine import TimeXerInferenceEngine
          import pandas as pd
          engine = TimeXerInferenceEngine()
          df = pd.read_csv('data/stations_sample/st01_hoankiem.csv')
          res = engine.predict(df, horizon=24)
          print('[THÀNH CÔNG] Inference Engine khởi động chuẩn xác. Số bước dự báo:', len(res['predictions']))
          "

  # ---------------------------------------------------------------------------
  # GIAI ĐOẠN 2: CONTINUOUS DELIVERY / DEPLOYMENT (CD) -> DOCKER HUB
  # ---------------------------------------------------------------------------
  docker-cd-pipeline:
    name: "CD: Build Docker Image & Public to Docker Hub"
    needs: ai-ci-pipeline
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'

    steps:
      - name: 1. Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: 2. Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      # TRƯỜNG HỢP 1: Khi đã thêm Secrets trên GitHub -> Đăng nhập & Đẩy lên Docker Hub
      - name: 3A. Đăng nhập Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4A. Build và Push Docker Image lên Docker Hub (Public)
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-ai:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # TRƯỜNG HỢP 2: Khi chưa thêm Secrets -> Build kiểm thử Dockerfile để đảm bảo đạt chuẩn 100%
      - name: 3B. Build Kiểm Thử Docker Image (Local Runner Verification)
        if: ${{ secrets.DOCKERHUB_USERNAME == '' || secrets.DOCKERHUB_TOKEN == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: timexer-dinov3-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 5. Báo cáo Kết Quả Triển Khai
        run: |
          echo "=========================================================="
          echo "🎉 DOCKER IMAGE BUILD & CD PIPELINE THÀNH CÔNG RỰC RỠ!"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "👉 Docker Hub Repo: https://hub.docker.com/r/${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-ai"
            echo "👉 Lệnh kéo Image: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/timexer-dinov3-ai:latest"
          else
            echo "👉 Dockerfile đã được biên dịch và kiểm thử thành công 100% trên runner!"
            echo "👉 Để tự động đẩy lên Docker Hub: Thêm DOCKERHUB_USERNAME và DOCKERHUB_TOKEN vào GitHub Secrets."
          fi
          echo "=========================================================="
